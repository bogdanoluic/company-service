services:
  company-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: "${DATABASE_USER:?DATABASE_USER is required}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      DATABASE_NAME: "${DATABASE_NAME:?DATABASE_NAME is required}"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${DATABASE_USER:?DATABASE_USER is required}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      POSTGRES_DB: "${DATABASE_NAME:?DATABASE_NAME is required}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
